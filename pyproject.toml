[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens-cli"
version = "0.3.0"
description = "An unofficial command-line interface for Anthropic's Jacobian lens"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
engine = [
  "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
  "transformers>=5.5,<6",
]
sharded = ["accelerate>=1.0"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
jlens = "jlens_cli.cli:main"
j-lens = "jlens_cli.cli:main"
jpplens = "jlens_cli.jpp:main"
"j-lens++" = "jlens_cli.jpp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real CPU Transformer and upstream jlens execution"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/jlens_cli/report.py" = ["E501"] # Embedded HTML/CSS/JavaScript asset.
